name: Release reviewed build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing reviewed tag to package
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Verify source and package Apple Silicon binary
        run: |
          go test ./...
          go vet ./...
          mkdir -p dist
          revision=$(git rev-parse HEAD)
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=1 go build -trimpath -ldflags "-X main.version=$revision" -o dist/git-auto-sync-darwin-arm64 .
          cd dist
          shasum -a 256 git-auto-sync-darwin-arm64 > SHA256SUMS
      - name: Publish a candidate in this fork
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Existing assets are never replaced: published checksums stay valid.
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/git-auto-sync-darwin-arm64 dist/SHA256SUMS
          else
            gh release create "$RELEASE_TAG" --prerelease --title "$RELEASE_TAG" --generate-notes dist/git-auto-sync-darwin-arm64 dist/SHA256SUMS
          fi
