name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
      branches:
        - "master"

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Setup Git Identity
        run: |
          git config --global user.email "test@example.com"
          git config --global user.name "GitHub CI"
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./...
